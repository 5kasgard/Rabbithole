name: publish-post3-v5

on:
  push:
    branches:
      - agent/field-product-0.18.0rc3
    paths:
      - .bootstrap/PUBLISH_V5

permissions:
  contents: write

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONHASHSEED: "0"
  TZ: UTC

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Reassemble and verify corrected transport
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum product-upload.zip | cut -d' ' -f1)" = "04c64945fd37a27641d0d35bf754dccf9b492a3bfcff69d0f8d4a535efd38ff6"

          test "$(sha256sum .bootstrap/fix-000a | cut -d' ' -f1)" = "a33624d57ddbdb53c9532ee0cacae0c3b70ad96fe6ab0fafa71b80c07ebcab17"
          test "$(sha256sum .bootstrap/fix-000b | cut -d' ' -f1)" = "954e8e60331832b9da4f73c304adcd1ebd2c135eb1e457ba75154b1591e9c54b"
          cat .bootstrap/fix-000a .bootstrap/fix-000b > .bootstrap/post3.patch.xz.b64.000
          test "$(sha256sum .bootstrap/post3.patch.xz.b64.000 | cut -d' ' -f1)" = "426dd30d733ef4fd2129ed64beb7f703060ecd323f177d63eac14ca903a67176"

          expected_005=(
            5fa65753429ac24c5d87ddc4d6d325ac0993215405bae6128ff6e356bcdfcd0c
            696078587bbbbda4cafa3a9deef5a70b508175316fc1e9a1907097fd428f0c51
            7a47488158c4ad9610841d5cbb06357927b32fb8d38bda3030825981eee3096d
            d555146013ac9337a4223018fdc0e6a025c94859308494ef5ea02419b6ceee92
            960f9ae3b34dfbe63e93ba771301417224a761cdbeee4af56a5b06c2f90aa882
            a0329da400679fc35cd038739529f0c9a28d9359a943ac60788f7537dc88b826
          )
          : > .bootstrap/post3.patch.xz.b64.005
          for i in $(seq 0 5); do
            n="$(printf '%02d' "$i")"
            f=".bootstrap/fix-005-${n}"
            test "$(sha256sum "$f" | cut -d' ' -f1)" = "${expected_005[$i]}"
            cat "$f" >> .bootstrap/post3.patch.xz.b64.005
          done
          test "$(sha256sum .bootstrap/post3.patch.xz.b64.005 | cut -d' ' -f1)" = "8f83a682f131bf96518bdbccd5fa3e937570c0a67eb4fcdf35cd113489c3b5b1"

          : > /tmp/post3.patch.xz.b64
          for i in $(seq 0 14); do
            n="$(printf '%03d' "$i")"
            cat ".bootstrap/post3.patch.xz.b64.${n}" >> /tmp/post3.patch.xz.b64
          done
          test "$(sha256sum /tmp/post3.patch.xz.b64 | cut -d' ' -f1)" = "ffb04a5d133be26ca59e0c5c8322833ed614cde77b7af34493ada6a4fd4fad99"
          base64 --decode /tmp/post3.patch.xz.b64 > /tmp/post3.patch.xz
          test "$(sha256sum /tmp/post3.patch.xz | cut -d' ' -f1)" = "775e70bc3e78188699fdd115e1f55a088ba81cc3d0dd8368ea5508fd922508d9"
          xz -t /tmp/post3.patch.xz

          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archive = Path('product-upload.zip')
          target = Path('/tmp/field-product')
          target.mkdir(parents=True, exist_ok=True)
          root = target.resolve()
          with ZipFile(archive) as zf:
              for info in zf.infolist():
                  name = info.filename.replace('\\', '/')
                  if name.startswith('/') or '..' in Path(name).parts:
                      raise SystemExit(f'unsafe ZIP member: {name}')
                  if (info.external_attr >> 16) & 0o170000 == 0o120000:
                      raise SystemExit(f'symlink refused: {name}')
                  destination = (target / name).resolve()
                  if destination != root and root not in destination.parents:
                      raise SystemExit(f'ZIP escape refused: {name}')
              if zf.testzip() is not None:
                  raise SystemExit('ZIP integrity failure')
              zf.extractall(target)
          PY
          cd /tmp/field-product
          git init -q
          git config user.name bootstrap
          git config user.email bootstrap@invalid
          git add -A
          git commit -qm base
          xz -dc /tmp/post3.patch.xz | git apply --index --binary --whitespace=nowarn

      - name: Mark reconstruction complete
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          content="$(printf 'reconstructed\n' | base64 -w0)"
          curl --fail-with-body --silent --show-error -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/contents/.bootstrap/STAGE_RECONSTRUCTED_V5" \
            -d "{\"message\":\"Mark post3 v5 reconstruction complete\",\"content\":\"${content}\",\"branch\":\"${BRANCH}\"}"

      - name: Validate exact unpacked product
        working-directory: /tmp/field-product
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[full,dev]'
          python scripts/check_repository.py --check
          field-master verify
          field-master capabilities
          python -m compileall -q rabbithole
          ruff check rabbithole scripts tests
          bandit -q -r rabbithole -x tests,history,experimental -ll
          mypy --follow-imports=skip --ignore-missing-imports \
            rabbithole/core.py rabbithole/field.py rabbithole/persistence.py \
            rabbithole/network.py rabbithole/subprocess_control.py rabbithole/wal.py \
            rabbithole/fast.py rabbithole/acquisition.py rabbithole/faculties.py \
            rabbithole/search.py rabbithole/tether.py rabbithole/outward_loop.py \
            rabbithole/perpetual_runtime.py rabbithole/performance_store.py \
            rabbithole/builtin_verifiers.py rabbithole/verifier_worker.py \
            rabbithole/capabilities.py rabbithole/actions.py \
            rabbithole/causal.py rabbithole/features.py
          scripts/audit_native.sh
          python scripts/run_product_tests.py --timeout 240 --json /tmp/product-tests.json
          python scripts/run_kernel_tests.py --timeout 180 --json /tmp/kernel-tests.json
          python scripts/build_release.py --outdir /tmp/dist --verify-reproducible
          python scripts/package_smoke.py --dist /tmp/dist --full

      - name: Mark validation complete
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          content="$(printf 'validated\n' | base64 -w0)"
          curl --fail-with-body --silent --show-error -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/contents/.bootstrap/STAGE_VALIDATED_V5" \
            -d "{\"message\":\"Mark post3 v5 validation complete\",\"content\":\"${content}\",\"branch\":\"${BRANCH}\"}"

      - name: Prove zero-dependency offline core
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/offline-core
          /tmp/offline-core/bin/python -m pip install --no-index --no-deps /tmp/dist/the_field_akbc-0.18.0rc3.post3-py3-none-any.whl
          /tmp/offline-core/bin/python - <<'PY'
          import importlib.metadata as metadata
          import rabbithole
          from rabbithole.features import capability_report
          assert rabbithole.__version__ == '0.18.0rc3.post3'
          requirements = metadata.requires('the-field-akbc') or []
          assert all('extra ==' in requirement for requirement in requirements)
          report = capability_report()
          assert report['installation']['mandatory_dependencies'] == []
          assert report['installation']['network_required_for_core'] is False
          PY

      - name: Mark offline proof complete
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          content="$(printf 'offline-proof-passed\n' | base64 -w0)"
          curl --fail-with-body --silent --show-error -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/contents/.bootstrap/STAGE_OFFLINE_V5" \
            -d "{\"message\":\"Mark post3 v5 offline proof complete\",\"content\":\"${content}\",\"branch\":\"${BRANCH}\"}"

      - name: Publish one clean unpacked product commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/field-product/.git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan product-publication
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/field-product/. .
          find . -type d \( -name __pycache__ -o -name .pytest_cache -o -name .mypy_cache -o -name .ruff_cache -o -name .hypothesis -o -name dist -o -name build -o -name '*.egg-info' \) -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.so' -o -name '*.dylib' -o -name '*.dll' -o -name '*.whl' -o -name '*.zip' \) -delete
          python scripts/check_repository.py --check
          git add -A
          git commit -m "Publish The Field 0.18.0rc3.post3 product repository"
          git push --force origin HEAD:agent/field-product-0.18.0rc3

      - name: Record publication failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          content="$(printf 'publication-failed\n' | base64 -w0)"
          curl --silent --show-error -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/contents/.bootstrap/PUBLISH_FAILED_V5" \
            -d "{\"message\":\"Record post3 v5 publication failure\",\"content\":\"${content}\",\"branch\":\"${BRANCH}\"}" || true
