name: publish-product-bootstrap

on:
  push:
    branches:
      - agent/field-product-0.18.0rc3
    paths:
      - product-upload.zip

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and safely extract product
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum product-upload.zip | cut -d' ' -f1)" = "def48cc10d94d6cd77db34f9dc41191d0403e40acf86d3960f49b0854e96c9be"
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          archive = Path('product-upload.zip')
          target = Path('/tmp/field-product')
          target.mkdir(parents=True, exist_ok=True)
          root = target.resolve()
          with ZipFile(archive) as zf:
              for info in zf.infolist():
                  name = info.filename.replace('\\', '/')
                  if name.startswith('/') or '..' in Path(name).parts:
                      raise SystemExit(f'unsafe ZIP member: {name}')
                  mode = info.external_attr >> 16
                  if mode & 0o170000 == 0o120000:
                      raise SystemExit(f'symlink ZIP member refused: {name}')
                  destination = (target / name).resolve()
                  if root not in destination.parents and destination != root:
                      raise SystemExit(f'ZIP member escaped target: {name}')
              zf.extractall(target)
          PY

      - name: Validate exact product source
        working-directory: /tmp/field-product
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
          python master_cli.py --root . verify
          python -m compileall -q rabbithole
          python tests/run_tests.py
          python scripts/run_product_tests.py

      - name: Publish one clean product commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan product-publication
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/field-product/. .
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type d -name .pytest_cache -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name 'librhfast.so' \) -delete
          git add -A
          git commit -m "Publish The Field 0.18.0rc3.post1 product repository"
          git push --force origin HEAD:agent/field-product-0.18.0rc3
