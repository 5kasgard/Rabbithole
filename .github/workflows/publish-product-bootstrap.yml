name: publish-product-bootstrap

on:
  push:
    branches:
      - agent/field-product-0.18.0rc3
    paths:
      - .bootstrap/READY

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct product source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/product.part.* > /tmp/product.tar.xz.b64
          base64 --decode /tmp/product.tar.xz.b64 > /tmp/product.tar.xz
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          tar -xJf /tmp/product.tar.xz -C .
      - name: Publish clean product commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish The Field 0.18.0rc3 product repository"
          git push origin HEAD:agent/field-product-0.18.0rc3
