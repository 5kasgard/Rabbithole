name: snapshot-action-runs-v8

on:
  push:
    branches:
      - agent/field-product-0.18.0rc3
    paths:
      - .bootstrap/SNAPSHOT_RUNS_V8

permissions:
  actions: read
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Snapshot recent branch runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --get \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-urlencode "branch=${BRANCH}" \
            --data-urlencode "event=push" \
            --data-urlencode "per_page=50" \
            "https://api.github.com/repos/${REPOSITORY}/actions/runs" \
            > /tmp/action-runs.json
          content="$(base64 -w0 /tmp/action-runs.json)"
          curl --fail-with-body --silent --show-error -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/contents/.bootstrap/ACTION_RUNS_V8.json" \
            -d "{\"message\":\"Record recent GitHub Actions runs\",\"content\":\"${content}\",\"branch\":\"${BRANCH}\"}"
